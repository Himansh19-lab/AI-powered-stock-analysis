# ==============================================================================
# AI-Powered Stock Analysis Configuration
# ==============================================================================

# LLM Generation Configuration
llm:
  provider: "openai"                            # Options: "openai", "bedrock", "google_genai"
  model_name: "gpt-4o-mini"                     # Bedrock: "amazon.nova-pro-v1:0", "meta.llama3-1-70b-instruct-v1:0"
  temperature: 0.1                              # Lower = more factual, Higher = more creative
  max_tokens: 2048                              # Maximum completion length

# Embeddings Configuration
embeddings:
  model_name: "openai:text-embedding-3-small"   # e.g., "openai:text-embedding-3-small", "amazon.titan-embed-text-v2:0"

# Text Chunking Settings
chunking:
  chunk_size: 1000                              # Characters per chunk
  chunk_overlap: 200                            # Overlapping characters between consecutive chunks

# Vector Retrieval Settings
retriever:
  top_k: 4                                      # Number of relevant chunks retrieved per query
  search_type: "similarity"                    # Search method: "similarity", "mmr"

# Storage Settings
storage:
  collection_name: "stock_embeddings"          # ChromaDB collection name
