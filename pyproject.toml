[project]
name = "ai-powered-stock-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Himanshu Srivastava", email = "1910himanshu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chroma>=0.2.0",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "fastapi>=0.143.2",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.0",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-powered-stock-analysis = "ai_powered_stock_analysis:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
